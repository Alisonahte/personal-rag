[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "pypdf", "python-multipart", "langchain-text-splitters", "chromadb", "sentence-transformers", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
